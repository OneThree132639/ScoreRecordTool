# .github/workflows/build-windows.yml

name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean `
            --onefile `
            --windowed `
            --name="ScoreRecordTool" `
            --icon="icon/icon.ico" `
            --add-data "buildin;buildin" `
            main.py
        continue-on-error: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoreRecordTool-Windows
          path: dist/ScoreRecordTool.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/ScoreRecordTool.exe"
          name: "Score Record Tool v${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
           python-version: "3.10"

       - name: Install dependencies
         run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
           pip install pyinstaller

       - name: Build with PyInstaller
         run: |
           pyinstaller --clean \
             --windowed \
             --name="ScoreRecordTool" \
             --icon="icon/icon.icns" \
             --add-data "buildin:buildin" \
             main.py

       - name: Install create-dmg
         run: |
           brew install create-dmg
           create-dmg --version

       - name: Create beautiful DMG
         run: |
           create-dmg \
             --volname "Score Record Tool Installer" \
             --volicon "icon/icon.icns" \
             --window-pos 200 120 \
             --window-size 800 400 \
             --icon-size 100 \
             --text-size 12 \
             --icon "ScoreRecordTool.app" 200 150 \
             --app-drop-link 600 150 \
             --eula "LICENSE" \
             "dist/Score-Record-Tool.dmg" \
             "dist/"

       - name: Upload artifact
         uses: actions/upload-artifact@v4
         with: 
           name: Score-Record-Tool-macOS
           path: dist/Score-Record-Tool.dmg

       - name: Create release
         if: startsWith(github.ref, 'refs/tags/')
         uses: softprops/action-gh-release@v2
         with:
           files: "dist/Score-Record-Tool.dmg"
           name: "Score Record Tool v${{ github.ref_name }} for macOS"
           tag_name: ${{ github.ref_name }}
           draft: false
           prerelease: false
         env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}